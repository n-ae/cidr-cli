version: 2.1

workflows:
  test:
    jobs:
      - test-cov

jobs:
  test-cov:
    docker:
      - image: cimg/node:current
    steps:
      - checkout
      - run:
          name: Install dependencies
          command: npm install
      - run:
          name: Run tests and collect coverage
          command: npm run test:coverage
      # Coverage is uploaded to Codecov from GitHub Actions
      # (.github/workflows/ci.yml), not from here. The codecov orb used to run
      # in this job, but it fails before it can upload: its integrity check
      # fetches a public key from https://keybase.io/codecovsecops/pgp_keys.asc,
      # which returns something gpg can't parse ("no valid OpenPGP data found"),
      # and the orb's skip_validation flag does not suppress that step. Even
      # with that fixed it would need CODECOV_TOKEN and would double-report the
      # same commit alongside the Actions upload, so this job just runs tests.
